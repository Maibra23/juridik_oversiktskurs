# CI-workflow för juridik_oversiktskurs.
# Ansvar: vid push och pull request köra lint (ruff), typkontroll (mypy på
# utils/) och testsviten (pytest) på Python 3.11 utan HF-token, dvs. i
# offlineläge, samt JS-testerna för grafens skiktlogik. Inga deploy-steg här.
#
# JS-testerna kör med nodes inbyggda testlöpare och kräver inga beroenden.
# De täcker enbart utils/static/taxonomigraf_logik.js, som är DOM-fri.
# Grafens DOM-lager testas inte här: det hämtar vis-network från CDN, och
# CI kör offline, så ett webbläsartest hade fallit av skäl som inte rör koden.
#
# Verktygen är pinnade. Opinnade var de en tickande bomb: ruff 0.16.0 breddade
# sitt förval 2026-07-23 och sänkte lintsteget på oförändrad kod, vilket i sin
# tur hoppade över typkontroll och tester i fem körningar. Regeluppsättningen
# ligger i ruff.toml. Höj versionerna medvetet, inte av misstag.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installera beroenden
        run: |
          pip install -r requirements.txt
          pip install pytest==9.0.2 ruff==0.16.1 mypy==2.3.0
      - name: Lint
        run: ruff check .
      - name: Typkontroll
        run: mypy --ignore-missing-imports utils
      - name: Tester
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS-tester
        run: node --test tests/js/
