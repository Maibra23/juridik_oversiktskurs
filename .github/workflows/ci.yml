# CI-workflow för juridik_oversiktskurs.
# Ansvar: vid push och pull request köra lint (ruff), typkontroll (mypy på
# utils/) och testsviten (pytest) på Python 3.11 utan HF-token, dvs. i
# offlineläge. Inga deploy-steg här.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installera beroenden
        run: |
          pip install -r requirements.txt
          pip install pytest ruff mypy
      - name: Lint
        run: ruff check .
      - name: Typkontroll
        run: mypy --ignore-missing-imports utils
      - name: Tester
        run: pytest -q
