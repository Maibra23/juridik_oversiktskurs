# Streamlit-konfiguration för Juridikverkstan.
# Ansvar: tema (färger, typsnitt), serverinställningar och
# telemetri-avstängning. Inga hemligheter här; de ligger i secrets.toml.

[browser]
gatherUsageStats = false

[theme]
# Palett ur design_system.md avsnitt 1. Detaljerade komponentstilar ligger
# i den centrala CSS-strängen i utils/ui.py.
primaryColor = "#2C5F8A"
backgroundColor = "#FAF7F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A2332"
font = "serif"
